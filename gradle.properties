# إعدادات Gradle — نسخة الإنتاج
# كانت هذه الملفات تُبنى على جهاز بلا IPv6 فعّال، فكان Java يفشل في حل الأسماء
# بينما curl ينجح (لأنه يعود إلى IPv4). لذلك نُفضّل IPv4 صراحةً.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
